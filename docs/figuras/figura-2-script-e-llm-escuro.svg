<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="O LLM fica de um lado e o script determinístico do outro; entre eles só passam comandos e JSON. O token vive só no cliente HTTP do script; o GitHub é lido pelo gh. A escrita passa sempre pela guarda: pelo botão Gravar ou por write --confirm depois do seu pode gravar." font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" style="color:#E3E8E6"><defs><marker id="f2-seta-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#E3E8E6"/></marker><marker id="f2-seta-voce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#8FB0FF"/></marker><marker id="f2-seta-segredo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#E9A640"/></marker></defs><rect width="1200" height="470" fill="#111618"/><rect x="430" y="0" width="470" height="470" rx="0" style="fill:#55C593;fill-opacity:0.07"/><text x="446" y="458" font-size="10.5" font-weight="600" text-anchor="start" style="fill:#55C593">DETERMINÍSTICO · PYTHON</text><line x1="320" y1="40" x2="320" y2="460" style="stroke:#35444A;stroke-width:1.2;stroke-dasharray:4 4"/><line x1="420" y1="40" x2="420" y2="460" style="stroke:#35444A;stroke-width:1.2;stroke-dasharray:4 4"/><text x="370" y="404" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">só comando</text><text x="370" y="418" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">e JSON;</text><text x="370" y="438" font-size="11" font-weight="600" text-anchor="middle" style="fill:#E9A640">nunca o token</text><rect x="20" y="8" width="220" height="48" rx="3" style="fill:#182024;stroke:#8FB0FF;stroke-width:1.3"/><text x="130" y="29" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#8FB0FF">Você</text><text x="130" y="46" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">no chat e na tela</text><rect x="20" y="110" width="280" height="330" rx="3" style="fill:#182024;stroke:#BC9CF6;stroke-width:1.3"/><text x="36" y="136" font-size="13.5" font-weight="600" text-anchor="start" style="fill:#BC9CF6">LLM (o agente)</text><text x="36" y="154" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">faz o que exige leitura</text><text x="36" y="186" font-size="12" font-weight="400" text-anchor="start" style="fill:#E3E8E6">· resolve os ???</text><text x="36" y="210" font-size="12" font-weight="400" text-anchor="start" style="fill:#E3E8E6">· junta fatias de sessões paralelas</text><text x="36" y="234" font-size="12" font-weight="400" text-anchor="start" style="fill:#E3E8E6">· liga PR e branch à task</text><text x="36" y="258" font-size="12" font-weight="400" text-anchor="start" style="fill:#E3E8E6">· preenche buraco pela vizinha</text><text x="36" y="282" font-size="12" font-weight="400" text-anchor="start" style="fill:#E3E8E6">· escreve requisito e feito</text><text x="36" y="306" font-size="12" font-weight="400" text-anchor="start" style="fill:#E3E8E6">· monta o plano, nota por trecho</text><text x="36" y="360" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">marca a origem de tudo:</text><text x="36" y="376" font-size="11" font-weight="400" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#9AA7AC">usuario · ancora · inferencia</text><text x="36" y="392" font-size="11" font-weight="400" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#9AA7AC">proximidade</text><text x="36" y="422" font-size="11.5" font-weight="600" text-anchor="start" style="fill:#E9A640">não vê o token</text><rect x="440" y="10" width="280" height="56" rx="3" style="fill:#182024;stroke:#55C593;stroke-width:1.3"/><text x="456" y="32" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#55C593">front local · 127.0.0.1</text><text x="456" y="50" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">recusa plano sem nota ou fora da grade</text><rect x="440" y="100" width="280" height="60" rx="3" style="fill:#182024;stroke:#55C593;stroke-width:2"/><text x="456" y="122" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#55C593">guarda de escrita</text><text x="456" y="139" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">agenda, grade, almoço, sobreposição</text><text x="456" y="153" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">com qualquer bloqueio, nada entra</text><rect x="440" y="190" width="280" height="60" rx="3" style="fill:#182024;stroke:#55C593;stroke-width:1.3"/><text x="456" y="212" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#55C593">leitura das fontes</text><text x="456" y="229" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">agentes · GitHub · planilha · comentários</text><rect x="440" y="280" width="280" height="60" rx="3" style="fill:#182024;stroke:#55C593;stroke-width:1.3"/><text x="456" y="302" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#55C593">âncoras e votação</text><text x="456" y="319" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">regra fixa: mesma entrada, mesma saída</text><rect x="760" y="100" width="130" height="160" rx="3" style="fill:#182024;stroke:#55C593;stroke-width:1.3"/><text x="825" y="124" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#55C593">cliente HTTP</text><text x="825" y="146" font-size="11" font-weight="400" text-anchor="middle" style="fill:#E9A640">o token só</text><text x="825" y="160" font-size="11" font-weight="400" text-anchor="middle" style="fill:#E9A640">existe aqui</text><text x="825" y="196" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">GET: leitura</text><text x="825" y="222" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">POST + PUT:</text><text x="825" y="236" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">só pela guarda</text><rect x="950" y="115" width="230" height="60" rx="3" style="fill:#182024;stroke:#F08BB9;stroke-width:1.3"/><text x="966" y="139" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#F08BB9">API do ClickUp</text><text x="966" y="157" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">lançamentos, tasks, comentários</text><rect x="950" y="200" width="230" height="60" rx="3" style="fill:#182024;stroke:#55C593;stroke-width:1.3"/><text x="966" y="224" font-size="12.5" font-weight="600" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#55C593">clickup-token</text><text x="966" y="242" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">digital, depois o Keychain</text><rect x="950" y="300" width="230" height="50" rx="3" style="fill:#182024;stroke:#A9B4BF;stroke-width:1.3"/><text x="966" y="321" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#A9B4BF">GitHub</text><text x="966" y="339" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">feed de eventos, só leitura</text><path d="M240 26 H439" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="340" y="20" font-size="11" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">confere e grava</text><path d="M130 56 V109" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="137" y="88" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">pede e aprova</text><path d="M280 110 V58 H439" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="52" font-size="11" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#E3E8E6">plano.json</text><path d="M580 66 V99" style="fill:none;stroke:#8FB0FF;stroke-width:2" marker-end="url(#f2-seta-voce)"/><text x="587" y="88" font-size="11" font-weight="600" text-anchor="start" style="fill:#8FB0FF">Gravar</text><path d="M300 118 H439" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="112" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#E3E8E6">write · prévia</text><path d="M300 146 H439" style="fill:none;stroke:#8FB0FF;stroke-width:1.6;stroke-dasharray:5 4" marker-end="url(#f2-seta-voce)"/><text x="370" y="140" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#8FB0FF">write --confirm</text><text x="370" y="162" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#8FB0FF">só depois do seu</text><text x="370" y="175" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#8FB0FF">“pode gravar”</text><path d="M300 216 H439" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="198" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#E3E8E6">sugerir --json</text><text x="370" y="210" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#E3E8E6">tarefas --json</text><path d="M580 250 V279" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="587" y="269" font-size="11" font-weight="400" text-anchor="start" style="fill:#9AA7AC">eventos</text><path d="M440 312 H301" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="328" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#E3E8E6">trechos, âncoras,</text><text x="370" y="341" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#E3E8E6">“também”, tasks</text><path d="M720 130 H759" style="fill:none;stroke:#8FB0FF;stroke-width:2" marker-end="url(#f2-seta-voce)"/><text x="740" y="124" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#8FB0FF">grava</text><path d="M720 220 H759" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="740" y="214" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">lê</text><path d="M720 240 H740 V325 H949" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="845" y="319" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#9AA7AC">gh api</text><path d="M890 145 H949" style="fill:none;stroke:#E3E8E6;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="920" y="139" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#9AA7AC">HTTPS</text><path d="M950 230 H891" style="fill:none;stroke:#E9A640;stroke-width:1.4" marker-end="url(#f2-seta-segredo)"/><text x="920" y="224" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#E9A640">token</text></svg>
