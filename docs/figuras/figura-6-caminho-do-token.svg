<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="O token entra uma vez pelo seu terminal e o clickup-token, que vem pronto com a skill, grava o item confiando só no próprio hash; cada leitura pede a digital; o agente recebe só o JSON; o security e outros apps só leem com a senha do chaveiro." font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" style="color:#1B2427"><defs><marker id="f6-seta-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#1B2427"/></marker><marker id="f6-seta-segredo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#A35F00"/></marker><marker id="f6-seta-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#58656B"/></marker></defs><rect width="1200" height="380" fill="#F4F5F3"/><rect x="20" y="45" width="180" height="50" rx="3" style="fill:#FFFFFF;stroke:#2350C4;stroke-width:1.3"/><text x="110" y="66" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#2350C4">Você, no terminal</text><text x="110" y="83" font-size="11" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">./apontar na 1ª vez</text><rect x="260" y="175" width="180" height="50" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><text x="350" y="196" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#1D7653">Scripts Python</text><text x="350" y="213" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">sugerir, front, write</text><rect x="20" y="175" width="180" height="50" rx="3" style="fill:#FFFFFF;stroke:#B23F74;stroke-width:1.3"/><text x="110" y="196" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#B23F74">API do ClickUp</text><text x="110" y="213" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">token só no header</text><rect x="260" y="302" width="180" height="66" rx="3" style="fill:#FFFFFF;stroke:#7446BF;stroke-width:1.3"/><text x="350" y="322" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#7446BF">Agente</text><text x="350" y="339" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">vê só o JSON</text><text x="350" y="355" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">o digital recusa sem terminal</text><text x="500" y="22" font-size="13.5" font-weight="600" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1D7653">clickup-token</text><text x="620" y="22" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">vem pronto em bin/, universal</text><rect x="500" y="30" width="220" height="220" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><line x1="500" y1="140" x2="720" y2="140" style="stroke:#CBD2CE;stroke-width:1.2"/><text x="516" y="60" font-size="13" font-weight="600" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1B2427">gravar</text><text x="516" y="78" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">1ª vez ou troca de token</text><text x="516" y="172" font-size="13" font-weight="600" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1B2427">ler</text><text x="516" y="190" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">cada execução</text><rect x="880" y="30" width="260" height="220" rx="3" style="fill:#FFFFFF;stroke:#CBD2CE;stroke-width:1.2"/><text x="896" y="58" font-size="13.5" font-weight="600" text-anchor="start" style="fill:#1B2427">Keychain</text><text x="896" y="78" font-size="11.5" font-weight="400" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">clickup-irrah-tech</text><text x="896" y="112" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">lista de confiança:</text><text x="896" y="128" font-size="12" font-weight="600" text-anchor="start" style="fill:#1B2427">só o clickup-token,</text><text x="896" y="144" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">pelo hash do binário</text><rect x="535" y="300" width="150" height="50" rx="3" style="fill:#FFFFFF;stroke:#A35F00;stroke-width:2"/><text x="610" y="321" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#A35F00">Touch ID</text><text x="610" y="338" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">LocalAuthentication</text><rect x="880" y="305" width="260" height="50" rx="3" style="fill:#FFFFFF;stroke:#CBD2CE;stroke-width:1.2;stroke-dasharray:3 3"/><text x="1010" y="326" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#1B2427">security e outros apps</text><text x="1010" y="343" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">caem no diálogo de senha</text><path d="M200 70 H499" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f6-seta-ink)"/><text x="350" y="62" font-size="11" font-weight="400" text-anchor="middle" style="fill:#A35F00">token, sem eco</text><path d="M720 70 H879" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f6-seta-ink)"/><text x="800" y="62" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">grava o item</text><text x="800" y="86" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">confiando só nele</text><path d="M440 192 H499" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f6-seta-ink)"/><text x="470" y="186" font-size="11" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">ler</text><path d="M500 212 H441" style="fill:none;stroke:#A35F00;stroke-width:1.4" marker-end="url(#f6-seta-segredo)"/><text x="470" y="228" font-size="11" font-weight="400" text-anchor="middle" style="fill:#A35F00">token</text><path d="M720 200 H879" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f6-seta-ink)"/><text x="800" y="194" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">lê sem diálogo</text><text x="800" y="214" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">(mesmo hash)</text><path d="M610 251 V299" style="fill:none;stroke:#A35F00;stroke-width:1.8" marker-end="url(#f6-seta-segredo)" marker-start="url(#f6-seta-segredo)"/><text x="618" y="279" font-size="11" font-weight="400" text-anchor="start" style="fill:#A35F00">digital antes de ler</text><path d="M1010 304 V251" style="fill:none;stroke:#58656B;stroke-width:1.4;stroke-dasharray:5 4" marker-end="url(#f6-seta-muted)"/><text x="1018" y="282" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">só com a senha</text><path d="M260 200 H201" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f6-seta-ink)"/><text x="230" y="192" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">header</text><path d="M350 225 V301" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f6-seta-ink)"/><text x="358" y="266" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">só o JSON</text></svg>
