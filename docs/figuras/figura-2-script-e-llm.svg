<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="O LLM fica de um lado e o script determinístico do outro; entre eles só passam comandos e JSON. O token vive só no cliente HTTP do script; o GitHub é lido pelo gh. A escrita passa sempre pela guarda: pelo botão Gravar ou por write --confirm depois do seu pode gravar." font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" style="color:#1B2427"><defs><marker id="f2-seta-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#1B2427"/></marker><marker id="f2-seta-voce" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#2350C4"/></marker><marker id="f2-seta-segredo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:#A35F00"/></marker></defs><rect width="1200" height="470" fill="#F4F5F3"/><rect x="430" y="0" width="470" height="470" rx="0" style="fill:#1D7653;fill-opacity:0.07"/><text x="446" y="458" font-size="10.5" font-weight="600" text-anchor="start" style="fill:#1D7653">DETERMINÍSTICO · PYTHON</text><line x1="320" y1="40" x2="320" y2="460" style="stroke:#CBD2CE;stroke-width:1.2;stroke-dasharray:4 4"/><line x1="420" y1="40" x2="420" y2="460" style="stroke:#CBD2CE;stroke-width:1.2;stroke-dasharray:4 4"/><text x="370" y="404" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">só comando</text><text x="370" y="418" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">e JSON;</text><text x="370" y="438" font-size="11" font-weight="600" text-anchor="middle" style="fill:#A35F00">nunca o token</text><rect x="20" y="8" width="220" height="48" rx="3" style="fill:#FFFFFF;stroke:#2350C4;stroke-width:1.3"/><text x="130" y="29" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#2350C4">Você</text><text x="130" y="46" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">no chat e na tela</text><rect x="20" y="110" width="280" height="330" rx="3" style="fill:#FFFFFF;stroke:#7446BF;stroke-width:1.3"/><text x="36" y="136" font-size="13.5" font-weight="600" text-anchor="start" style="fill:#7446BF">LLM (o agente)</text><text x="36" y="154" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">faz o que exige leitura</text><text x="36" y="186" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">· resolve os ???</text><text x="36" y="210" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">· junta fatias de sessões paralelas</text><text x="36" y="234" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">· liga PR e branch à task</text><text x="36" y="258" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">· preenche buraco pela vizinha</text><text x="36" y="282" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">· escreve requisito e feito</text><text x="36" y="306" font-size="12" font-weight="400" text-anchor="start" style="fill:#1B2427">· monta o plano, nota por trecho</text><text x="36" y="360" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">marca a origem de tudo:</text><text x="36" y="376" font-size="11" font-weight="400" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">usuario · ancora · inferencia</text><text x="36" y="392" font-size="11" font-weight="400" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">proximidade</text><text x="36" y="422" font-size="11.5" font-weight="600" text-anchor="start" style="fill:#A35F00">não vê o token</text><rect x="440" y="10" width="280" height="56" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><text x="456" y="32" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#1D7653">front local · 127.0.0.1</text><text x="456" y="50" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">recusa plano sem nota ou fora da grade</text><rect x="440" y="100" width="280" height="60" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:2"/><text x="456" y="122" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#1D7653">guarda de escrita</text><text x="456" y="139" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">agenda, grade, almoço, sobreposição</text><text x="456" y="153" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">com qualquer bloqueio, nada entra</text><rect x="440" y="190" width="280" height="60" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><text x="456" y="212" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#1D7653">leitura das fontes</text><text x="456" y="229" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">agentes · GitHub · planilha · comentários</text><rect x="440" y="280" width="280" height="60" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><text x="456" y="302" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#1D7653">âncoras e votação</text><text x="456" y="319" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">regra fixa: mesma entrada, mesma saída</text><rect x="760" y="100" width="130" height="160" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><text x="825" y="124" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:#1D7653">cliente HTTP</text><text x="825" y="146" font-size="11" font-weight="400" text-anchor="middle" style="fill:#A35F00">o token só</text><text x="825" y="160" font-size="11" font-weight="400" text-anchor="middle" style="fill:#A35F00">existe aqui</text><text x="825" y="196" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">GET: leitura</text><text x="825" y="222" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">POST + PUT:</text><text x="825" y="236" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">só pela guarda</text><rect x="950" y="115" width="230" height="60" rx="3" style="fill:#FFFFFF;stroke:#B23F74;stroke-width:1.3"/><text x="966" y="139" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#B23F74">API do ClickUp</text><text x="966" y="157" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">lançamentos, tasks, comentários</text><rect x="950" y="200" width="230" height="60" rx="3" style="fill:#FFFFFF;stroke:#1D7653;stroke-width:1.3"/><text x="966" y="224" font-size="12.5" font-weight="600" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1D7653">clickup-token</text><text x="966" y="242" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">digital, depois o Keychain</text><rect x="950" y="300" width="230" height="50" rx="3" style="fill:#FFFFFF;stroke:#4B5561;stroke-width:1.3"/><text x="966" y="321" font-size="12.5" font-weight="600" text-anchor="start" style="fill:#4B5561">GitHub</text><text x="966" y="339" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">feed de eventos, só leitura</text><path d="M240 26 H439" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="340" y="20" font-size="11" font-weight="400" text-anchor="middle" style="fill:#58656B">confere e grava</text><path d="M130 56 V109" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="137" y="88" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">pede e aprova</text><path d="M280 110 V58 H439" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="52" font-size="11" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1B2427">plano.json</text><path d="M580 66 V99" style="fill:none;stroke:#2350C4;stroke-width:2" marker-end="url(#f2-seta-voce)"/><text x="587" y="88" font-size="11" font-weight="600" text-anchor="start" style="fill:#2350C4">Gravar</text><path d="M300 118 H439" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="112" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1B2427">write · prévia</text><path d="M300 146 H439" style="fill:none;stroke:#2350C4;stroke-width:1.6;stroke-dasharray:5 4" marker-end="url(#f2-seta-voce)"/><text x="370" y="140" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#2350C4">write --confirm</text><text x="370" y="162" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#2350C4">só depois do seu</text><text x="370" y="175" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#2350C4">“pode gravar”</text><path d="M300 216 H439" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="198" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1B2427">sugerir --json</text><text x="370" y="210" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#1B2427">tarefas --json</text><path d="M580 250 V279" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="587" y="269" font-size="11" font-weight="400" text-anchor="start" style="fill:#58656B">eventos</text><path d="M440 312 H301" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="370" y="328" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#1B2427">trechos, âncoras,</text><text x="370" y="341" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#1B2427">“também”, tasks</text><path d="M720 130 H759" style="fill:none;stroke:#2350C4;stroke-width:2" marker-end="url(#f2-seta-voce)"/><text x="740" y="124" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#2350C4">grava</text><path d="M720 220 H759" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="740" y="214" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#58656B">lê</text><path d="M720 240 H740 V325 H949" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="845" y="319" font-size="10.5" font-weight="400" text-anchor="middle" font-family="Menlo, 'SF Mono', Consolas, monospace" style="fill:#58656B">gh api</text><path d="M890 145 H949" style="fill:none;stroke:#1B2427;stroke-width:1.4" marker-end="url(#f2-seta-ink)"/><text x="920" y="139" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#58656B">HTTPS</text><path d="M950 230 H891" style="fill:none;stroke:#A35F00;stroke-width:1.4" marker-end="url(#f2-seta-segredo)"/><text x="920" y="224" font-size="10.5" font-weight="400" text-anchor="middle" style="fill:#A35F00">token</text></svg>
